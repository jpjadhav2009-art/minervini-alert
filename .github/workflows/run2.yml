name: Minervini Alert (Part 2)

on:
  schedule:
    # 10:38 UTC = 4:08 PM IST (Mon-Fri). Half an hour after the 3:30 PM close,
    # so the daily candle is confirmed, and five minutes behind part 1 so the
    # two runs do not compete for Yahoo Finance or hit Telegram's flood limits.
    - cron: '38 10 * * 1-5'
  workflow_dispatch:

# No keep-alive step here: part 1 already pushes the weekly heartbeat, and two
# workflows committing to main on the same morning would race each other.

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests schedule pytz yfinance pandas numpy
      - run: python minervini_alert.py --now --part 2
