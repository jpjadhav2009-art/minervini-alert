name: Minervini Alert

on:
  schedule:
    - cron: '45 9 * * 1-5'   # 3:15 PM IST (Mon-Fri) -- runs breakout + universe + vcp scans
  workflow_dispatch:          # lets you trigger manually to test

permissions:
  contents: write   # needed to commit the breakout watchlist back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests schedule pytz yfinance pandas numpy
      - run: python minervini_alert.py --now
      - name: Commit updated watchlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update breakout watchlist [skip ci]"
          git push
