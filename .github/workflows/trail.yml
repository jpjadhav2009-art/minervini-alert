name: Minervini Trader - Trail/Reconcile

on:
  schedule:
    - cron: '5 10 * * 1-5'   # 3:35 PM IST (Mon-Fri) -- after close, after the 3:15/3:30 scans
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trail:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests schedule pytz yfinance pandas numpy
      - run: python minervini_trader.py --trail
      - name: Commit updated positions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update open/closed positions (trail) [skip ci]"
          git push
